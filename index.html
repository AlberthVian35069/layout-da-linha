  <script>
    /* Aplica tema / menu / cor antes da primeira pintura (evita "piscar") */
    (function () {
      var r = document.documentElement;
      try {
        var s = JSON.parse(localStorage.getItem('ll.settings') || '{}');
        var t = s.theme || 'system';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        r.dataset.theme = t;
        if (s.sidebarCollapsed) r.classList.add('sb-collapsed');
        if (s.accent) r.style.setProperty('--accent', s.accent);
        if (s.density === 'compact') r.classList.add('density-compact');
      } catch (e) { r.dataset.theme = 'light'; }
    })();
  </script>
</head>
